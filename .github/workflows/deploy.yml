name: Deploy to Azure
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # Nothing reaches production that has not passed. Before this gate existed, a push with a
  # failing suite deployed anyway — the suite only ran on whoever's laptop remembered it.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm run install:all
      - run: npm run build
      - run: npm install --omit=dev --prefix backend

      - name: Assemble deploy package
        run: |
          mkdir -p deploy/backend deploy/frontend
          cp -r backend/* deploy/backend/
          cp -r frontend/dist deploy/frontend/dist
          cd deploy && zip -r ../deploy.zip . -x '.*'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (zip deploy)
        run: |
          az webapp deploy --resource-group gameroom-rg --name whathappened \
            --src-path deploy.zip --type zip

  # A green deploy is not proof the change is live — see CLAUDE.md. These checks are read-only
  # and run against the real site.
  smoke:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://whathappened.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - run: pip install -r e2e/requirements.txt

      # Azure recycles the container on deploy and it can take a minute or two to answer.
      # Waiting here rather than restarting it — stacking restarts has caused a real outage.
      - name: Wait for the site to come back
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$E2E_BASE_URL/api/health" | grep -q '"ok":true'; then
              echo "healthy after $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "site did not become healthy within 5 minutes"; exit 1

      - run: pytest -m production -v
        working-directory: e2e
